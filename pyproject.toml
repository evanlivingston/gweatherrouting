[project]
name = "gweatherrouting"
dynamic = ["version"]
description = "Sailing routing and navigation software"
readme = "README.md"
requires-python = ">= 3.10"
license = {text = "GPLv3"}
authors = [
    {name = "Davide Gessa", email = "gessadavide@gmail.com"},
]
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "pycairo",
    "requests",
    "keyring>=25,<26",
    "copernicusmarine>=2.2,<3; python_version >= '3.10'",
    "colorlog",
    "geojson_utils",
    "bs4",
    "pyserial",
    "pynmea2",
    "gpxpy",
    "numpy",
    "netCDF4>=1.6",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "nmeatoolkit>=0.2",
    "appdirs",
    "matplotlib",
    "weatherrouting>=0.2.1",
    "GDAL[numpy];sys_platform == 'darwin'",
    #"GDAL[numpy]==3.8.4;sys_platform == 'linux'",
    "GDAL[numpy];sys_platform == 'win32'"
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
qt = [] # Compatibility extra: Qt is now installed by default.
marine-global = ["copernicusmarine>=2.2,<3"]

[project.urls]
Homepage = "https://github.com/dakk/gweatherrouting"
"Bug Tracker" = "https://github.com/dakk/gweatherrouting/issues/"
Documentation = "https://github.com/dakk/gweatherrouting"
Source = "https://github.com/dakk/gweatherrouting"

[project.scripts]
gweatherrouting = "gweatherrouting.__main__:main"
gweatherrouting-qt = "gweatherrouting.qt.__main__:main"

[tool.setuptools]
packages = [
    "gweatherrouting",
    "gweatherrouting.core",
    "gweatherrouting.core.utils",
    "gweatherrouting.core.geo",
    "gweatherrouting.core.gribsources",
    "gweatherrouting.core.marine",
    "gweatherrouting.common",
    "gweatherrouting.qt",
    "gweatherrouting.rendering",
    "gweatherrouting.rendering.vectordrawer",
]
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "gweatherrouting.__version__" }

[tool.setuptools.package-data]
gweatherrouting = [
    "data/*",
    "data/boats/*",
    "data/polars/*",
    "data/symbols/*",
    "data/s57/*",
    "data/icons/*",
    "qt/shaders/*.qml",
    "qt/shaders/*.frag",
    "qt/shaders/*.vert",
    "qt/shaders/*.qsb",
]

[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
