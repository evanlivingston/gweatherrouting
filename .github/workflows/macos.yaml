name: macOS

on:
  push:
    branches: [master, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up macOS development environment
        run: make setup-macos

      - name: Check native dependencies and application imports
        run: |
          source .venv/bin/activate
          mkdir -p "$RUNNER_TEMP/gww-home"
          HOME="$RUNNER_TEMP/gww-home" python -c 'from PySide6.QtCore import qVersion; import osgeo.gdal_array; import gweatherrouting.__main__; print("Qt", qVersion(), "and GDAL bindings loaded")'
